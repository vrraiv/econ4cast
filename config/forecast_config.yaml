# Top-level orchestration config for data imports, nowcasts, and forecast evaluation.

run:
  forecast_date: "2026-05-10"
  vintage_label: "initial-scaffold"
  timezone: "America/Toronto"

calendar:
  sample_start: "1995-01-01"
  sample_end: null
  forecast_origin: "2026-05-10"
  frequencies:
    monthly: "M"
    quarterly: "Q"
  horizons:
    nowcast_quarters: 1
    short_term_quarters: 4
    medium_term_quarters: 12

geographies:
  us:
    name: "United States"
    currency: "USD"
  canada:
    name: "Canada"
    currency: "CAD"
  eurozone:
    name: "Eurozone"
    currency: "EUR"

paths:
  raw_data: "data/raw"
  interim_data: "data/interim"
  merged_data: "data/merged"
  processed_data: "data/processed"

sources:
  fred: "sources/fred.yaml"
  bea: "sources/bea.yaml"
  statcan: "sources/statcan.yaml"
  eurostat: "sources/eurostat.yaml"

targets:
  us_gdp: "targets/us_gdp.yaml"
  canada_gdp: "targets/canada_gdp.yaml"
  eurozone_gdp: "targets/eurozone_gdp.yaml"

transforms: "transforms.yaml"

modeling:
  benchmarks:
    - random_walk
    - ar1
  metrics:
    - mae
    - rmse

output:
  save_import_logs: true
  save_forecast_artifacts: true
  forecast_output_dir: "data/processed/forecasts"
