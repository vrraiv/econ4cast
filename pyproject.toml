[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "econ4cast"
version = "0.1.0"
description = "Short- and medium-term macroeconomic forecasting tools for the U.S., Canada, and the eurozone."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "requests>=2.31",
  "PyYAML>=6.0",
  "statsmodels>=0.14",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
  "ipykernel>=6.0",
  "jupyterlab>=4.0",
  "pytest>=7.0",
  "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
